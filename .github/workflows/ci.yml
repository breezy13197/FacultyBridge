name: Suite checks
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: suite-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  # Keep these job IDs/names: the main branch ruleset requires verify and test.
  verify:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Lint JavaScript for common bugs
        run: npm run lint
      - name: Guard against committed course fixtures
        run: |
          if [ -n "$(git ls-files 'tests/test files' 'tests/test-files' 'tests/local-baselines')" ]; then
            echo "Local course fixtures or baselines must not be committed."
            exit 1
          fi
      - run: npx playwright install --with-deps chromium
      - run: npm run validate:quick
      - uses: actions/upload-artifact@v4
        with:
          name: facultybridge-build
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-smoke-results
          path: test-results/
          retention-days: 14
  test:
    needs: verify
    # Tests take about 20-28 minutes. The browser install normally takes under
    # a minute, but once took 26.5 minutes because Ubuntu's package server was
    # slow. 60 minutes lets a run like that finish instead of being cancelled.
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Downloads the browsers (seconds) and installs the Linux libraries they
      # need from Ubuntu's package server (usually under a minute). Its own
      # limit means a truly stuck install fails here, under this step's name,
      # instead of leaving the tests without enough time.
      - name: Install Playwright browsers and system libraries
        timeout-minutes: 30
        run: npx playwright install --with-deps
      - run: npm run test:e2e
      # Retain synthetic reports even on success so retries/flakes stay visible.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
