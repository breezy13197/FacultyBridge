name: Suite checks
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: suite-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  # Keep these job IDs/names: the main branch ruleset requires verify and test.
  verify:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: Lint JavaScript for common bugs
        run: npm run lint
      - name: Guard against committed course fixtures
        run: |
          if [ -n "$(git ls-files 'tests/test files' 'tests/test-files' 'tests/local-baselines')" ]; then
            echo "Local course fixtures or baselines must not be committed."
            exit 1
          fi
      - run: npx playwright install --with-deps chromium
      - run: npm run validate:quick
      - uses: actions/upload-artifact@v4
        with:
          name: facultybridge-build
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-smoke-results
          path: test-results/
          retention-days: 14
  test:
    needs: verify
    # The suite itself takes about 20-28 minutes. 45 leaves room for a slow
    # runner without letting a truly stuck job run for hours.
    timeout-minutes: 45
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # Reuse the downloaded browsers (Chromium, Firefox, WebKit) between runs.
      # The key follows the installed Playwright version, so upgrading
      # Playwright automatically downloads and caches matching browsers.
      - name: Read installed Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - name: Restore cached Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-browsers-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}
      # Cache miss: download browsers and install their system libraries.
      # A stuck download fails here, by name, instead of eating the job timeout.
      - name: Install Playwright browsers and system libraries
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 10
        run: npx playwright install --with-deps
      # Cache hit: browsers are already present; only the system libraries
      # (which are not cached) need installing on the fresh runner.
      - name: Install Playwright system libraries
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        timeout-minutes: 10
        run: npx playwright install-deps
      - run: npm run test:e2e
      # Retain synthetic reports even on success so retries/flakes stay visible.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
