name: Suite checks
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: suite-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  # Keep these job IDs/names: the main branch ruleset requires verify and test.
  verify:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    outputs:
      playwright-version: ${{ steps.playwright-version.outputs.version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # The test job runs inside the Playwright image that matches this
      # version, so upgrading Playwright updates the image automatically.
      - name: Read installed Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_OUTPUT"
      - name: Lint JavaScript for common bugs
        run: npm run lint
      - name: Guard against committed course fixtures
        run: |
          if [ -n "$(git ls-files 'tests/test files' 'tests/test-files' 'tests/local-baselines')" ]; then
            echo "Local course fixtures or baselines must not be committed."
            exit 1
          fi
      - run: npx playwright install --with-deps chromium
      - run: npm run validate:quick
      - uses: actions/upload-artifact@v4
        with:
          name: facultybridge-build
          path: dist/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-smoke-results
          path: test-results/
          retention-days: 14
  test:
    needs: verify
    # Tests take about 20-28 minutes; 45 leaves room for a slow day.
    timeout-minutes: 45
    runs-on: ubuntu-latest
    # Playwright's official image already contains the browsers and the Linux
    # libraries they need, so nothing is downloaded from Ubuntu's package
    # server (which twice took over 25 minutes). Its version always matches
    # package-lock.json via the verify job.
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.verify.outputs.playwright-version }}-resolute
      options: --user 1001
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run test:e2e
      # Retain synthetic reports even on success so retries/flakes stay visible.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14
