name: Playwright Tests
on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
permissions:
  contents: read
concurrency:
  group: playwright-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    - name: Install dependencies
      run: npm ci
    - name: Guard against committed course fixtures
      run: |
        if [ -n "$(git ls-files 'tests/test files' 'tests/test-files' 'tests/local-baselines')" ]; then
          echo "Local course fixtures or baselines must not be committed."; exit 1
        fi
    - name: Install Playwright browsers
      run: npx playwright install --with-deps
    - name: Check source and build
      run: npm run check
    - name: Check site and standalone browser workflows
      run: npm run test:browser
    - name: Run Playwright tests
      run: npm run test:e2e
    - uses: actions/upload-artifact@v4
      if: failure()
      with:
        name: playwright-report
        path: |
          playwright-report/
          test-results/
        retention-days: 14
